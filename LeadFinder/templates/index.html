<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lead Finder — B2B Contact & Website Auditor</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .hero-card {
      max-width: 680px;
      text-align: center;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 48px 36px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.45);
    }
    .pill {
      display: inline-block;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(96, 165, 250, 0.4);
      color: #93c5fd;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    h1 {
      margin: 0 0 14px;
      font-size: 34px;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 28px;
      color: #cbd5e1;
      font-size: 15px;
      line-height: 1.6;
    }
    .cta-btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 12px;
      background: #2563eb;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
      transition: background 0.2s;
    }
    .cta-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="hero-card">
    <span class="pill">Manual URL Mode • Deep WA & Live Preview</span>
    <h1>Lead Finder</h1>
    <p>
      Ekstrak Nama PT dari tag H1, tarik nomor WhatsApp termasuk yang tersembunyi di balik gambar atau banner, dan tinjau kelayakan website target secara instan dalam satu dashboard.
    </p>
    <a href="/app" class="cta-btn">Buka Dashboard Manual →</a>
  </div>
</body>
</html>
